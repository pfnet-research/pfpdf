<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header class="book-cover">
      <div class="book-cover-frame">
        <div class="book-cover-topline">
          <p data-pfpdf-slot="series" class="book-cover-series"></p>
          <img data-pfpdf-slot="logo" class="book-cover-logo" alt="">
        </div>
        <div class="book-cover-main">
          <p data-pfpdf-slot="confidential" class="book-cover-confidential"></p>
          <div class="book-cover-ornament" aria-hidden="true">◆</div>
          <h1 data-pfpdf-slot="title" class="book-cover-title"></h1>
          <div class="book-cover-rule" aria-hidden="true"></div>
          <p data-pfpdf-slot="author" class="book-cover-author"></p>
          <p data-pfpdf-slot="date" class="book-cover-date"></p>
        </div>
      </div>
    </header>
    <div data-pfpdf-slot="toc" class="book-toc-container"></div>
    <main data-pfpdf-slot="content" class="book-content"></main>
  </body>
</html>
