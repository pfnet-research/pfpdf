<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header data-pfpdf-slot="cover" class="book-slide-cover">
      <div class="book-slide-cover-frame">
        <div class="book-slide-cover-topline">
          <p data-pfpdf-slot="series" class="book-slide-cover-series"></p>
          <img data-pfpdf-slot="logo" class="book-slide-cover-logo" alt="">
        </div>
        <div class="book-slide-cover-main">
          <p data-pfpdf-slot="confidential" class="book-slide-cover-confidential"></p>
          <h1 data-pfpdf-slot="title" class="book-slide-cover-title"></h1>
          <p data-pfpdf-slot="subtitle" class="book-slide-cover-subtitle"></p>
          <div class="book-slide-cover-rule" aria-hidden="true"></div>
          <p data-pfpdf-slot="author" class="book-slide-cover-author"></p>
          <p data-pfpdf-slot="date" class="book-slide-cover-date"></p>
        </div>
      </div>
    </header>
    <main data-pfpdf-slot="content" class="book-slide-content"></main>
  </body>
</html>
