<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header data-pfpdf-slot="cover" class="academic-slide-cover">
      <div class="academic-slide-cover-head">
        <p data-pfpdf-slot="series" class="academic-slide-cover-series"></p>
        <img data-pfpdf-slot="logo" class="academic-slide-cover-logo" alt="">
      </div>
      <div class="academic-slide-cover-main">
        <p data-pfpdf-slot="confidential" class="academic-slide-cover-confidential"></p>
        <h1 data-pfpdf-slot="title" class="academic-slide-cover-title"></h1>
        <p data-pfpdf-slot="subtitle" class="academic-slide-cover-subtitle"></p>
      </div>
      <div class="academic-slide-cover-meta">
        <p data-pfpdf-slot="author" class="academic-slide-cover-author"></p>
        <p data-pfpdf-slot="date" class="academic-slide-cover-date"></p>
      </div>
    </header>
    <main data-pfpdf-slot="content" class="academic-slide-content"></main>
  </body>
</html>
