<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header class="academic-cover">
      <div class="academic-cover-head">
        <p data-pfpdf-slot="series" class="academic-cover-series"></p>
        <img data-pfpdf-slot="logo" class="academic-cover-logo" alt="">
      </div>
      <div class="academic-cover-main">
        <p data-pfpdf-slot="confidential" class="academic-cover-confidential"></p>
        <h1 data-pfpdf-slot="title" class="academic-cover-title"></h1>
        <div class="academic-cover-meta">
          <p data-pfpdf-slot="author" class="academic-cover-author"></p>
          <p data-pfpdf-slot="date" class="academic-cover-date"></p>
        </div>
      </div>
    </header>
    <div data-pfpdf-slot="toc" class="academic-toc-container"></div>
    <main data-pfpdf-slot="content" class="academic-content"></main>
  </body>
</html>
