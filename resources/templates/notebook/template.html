<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header class="notebook-cover">
      <div class="notebook-cover-shape notebook-cover-shape-top" aria-hidden="true"></div>
      <div class="notebook-cover-shape notebook-cover-shape-bottom" aria-hidden="true"></div>
      <div class="notebook-cover-inner">
        <div class="notebook-cover-topline">
          <p data-pfpdf-slot="series" class="notebook-cover-series"></p>
          <img data-pfpdf-slot="logo" class="notebook-cover-logo" alt="">
        </div>
        <div class="notebook-cover-main">
          <p data-pfpdf-slot="confidential" class="notebook-cover-confidential"></p>
          <h1 data-pfpdf-slot="title" class="notebook-cover-title"></h1>
          <div class="notebook-cover-rule" aria-hidden="true"></div>
          <div class="notebook-cover-meta">
            <p data-pfpdf-slot="author" class="notebook-cover-author"></p>
            <p data-pfpdf-slot="date" class="notebook-cover-date"></p>
          </div>
        </div>
        <svg class="notebook-cover-dots" viewBox="0 0 42 28" aria-hidden="true">
          <g>
            <circle cx="3.5" cy="3.5" r="1.2"></circle>
            <circle cx="10.5" cy="3.5" r="1.2"></circle>
            <circle cx="17.5" cy="3.5" r="1.2"></circle>
            <circle cx="24.5" cy="3.5" r="1.2"></circle>
            <circle cx="31.5" cy="3.5" r="1.2"></circle>
            <circle cx="38.5" cy="3.5" r="1.2"></circle>
            <circle cx="3.5" cy="10.5" r="1.2"></circle>
            <circle cx="10.5" cy="10.5" r="1.2"></circle>
            <circle cx="17.5" cy="10.5" r="1.2"></circle>
            <circle cx="24.5" cy="10.5" r="1.2"></circle>
            <circle cx="31.5" cy="10.5" r="1.2"></circle>
            <circle cx="38.5" cy="10.5" r="1.2"></circle>
            <circle cx="3.5" cy="17.5" r="1.2"></circle>
            <circle cx="10.5" cy="17.5" r="1.2"></circle>
            <circle cx="17.5" cy="17.5" r="1.2"></circle>
            <circle cx="24.5" cy="17.5" r="1.2"></circle>
            <circle cx="31.5" cy="17.5" r="1.2"></circle>
            <circle cx="38.5" cy="17.5" r="1.2"></circle>
            <circle cx="3.5" cy="24.5" r="1.2"></circle>
            <circle cx="10.5" cy="24.5" r="1.2"></circle>
            <circle cx="17.5" cy="24.5" r="1.2"></circle>
            <circle cx="24.5" cy="24.5" r="1.2"></circle>
            <circle cx="31.5" cy="24.5" r="1.2"></circle>
            <circle cx="38.5" cy="24.5" r="1.2"></circle>
          </g>
        </svg>
      </div>
    </header>
    <div data-pfpdf-slot="toc" class="notebook-toc-container"></div>
    <main data-pfpdf-slot="content" class="notebook-content"></main>
  </body>
</html>
