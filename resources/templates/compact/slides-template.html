<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <header data-pfpdf-slot="cover" class="compact-slide-cover">
      <div class="compact-slide-cover-bar">
        <p data-pfpdf-slot="series" class="compact-slide-cover-series"></p>
        <img data-pfpdf-slot="logo" class="compact-slide-cover-logo" alt="">
      </div>
      <div class="compact-slide-cover-title-row">
        <h1 data-pfpdf-slot="title" class="compact-slide-cover-title"></h1>
        <p data-pfpdf-slot="confidential" class="compact-slide-cover-confidential"></p>
      </div>
      <p data-pfpdf-slot="subtitle" class="compact-slide-cover-subtitle"></p>
      <div class="compact-slide-cover-meta">
        <p data-pfpdf-slot="author"></p>
        <p data-pfpdf-slot="date"></p>
      </div>
    </header>
    <main data-pfpdf-slot="content" class="compact-slide-content"></main>
  </body>
</html>
